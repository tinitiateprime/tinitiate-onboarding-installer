name: tinitiate-databricks

services:
  dev:
    build:
      context: ../..
      dockerfile: docker/databricks/Dockerfile
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:?Set CODE_SERVER_PASSWORD in .env}
      DATABRICKS_CONFIG_FILE: /home/coder/.databricks/config
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../../:/home/coder/project
      - databricks_code_server_data:/home/coder/.local/share/code-server
      - databricks_config:/home/coder/.databricks
    restart: unless-stopped

volumes:
  databricks_code_server_data:
  databricks_config:
