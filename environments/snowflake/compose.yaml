name: tinitiate-snowflake

services:
  dev:
    build:
      context: ../..
      dockerfile: docker/snowflake/Dockerfile
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:?Set CODE_SERVER_PASSWORD in .env}
      SNOWFLAKE_HOME: /home/coder/.snowflake
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../../:/home/coder/project
      - snowflake_code_server_data:/home/coder/.local/share/code-server
      - snowflake_config:/home/coder/.snowflake
    restart: unless-stopped

volumes:
  snowflake_code_server_data:
  snowflake_config:
