name: tinitiate-aws

services:
  dev:
    build:
      context: ../..
      dockerfile: docker/aws/Dockerfile
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-Tinitiate!23456}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://floci:4566
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../../:/home/coder/project
      - aws_code_server_data:/home/coder/.local/share/code-server
      - aws_config:/home/coder/.aws
    depends_on:
      - floci
    restart: unless-stopped

  floci:
    image: floci/floci:latest
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "${FLOCI_AWS_PORT:-4566}:4566"
    volumes:
      - aws_floci_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  floci-ui:
    image: floci/floci-ui:latest
    ports:
      - "${FLOCI_UI_PORT:-4500}:4500"
    depends_on:
      - floci
    restart: unless-stopped

volumes:
  aws_code_server_data:
  aws_config:
  aws_floci_data:
