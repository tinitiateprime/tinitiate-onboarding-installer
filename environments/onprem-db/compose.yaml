name: tinitiate-onprem-db

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Tinitiate!23456}
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_PID: Developer
      TZ: ${DATABASE_TIMEZONE:-America/Chicago}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - mssql_backup:/var/opt/mssql/backup
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinitiate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Tinitiate!23456}
      POSTGRES_DB: ${POSTGRES_DB:-tinitiate}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      TZ: ${DATABASE_TIMEZONE:-America/Chicago}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=200
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/001-enable-vector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Tinitiate!23456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tinitiate}
      MYSQL_USER: ${MYSQL_USER:-tinitiate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Tinitiate!23456}
      TZ: ${DATABASE_TIMEZONE:-America/Chicago}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  oracle:
    profiles: [oracle]
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-Tinitiate!23456}
      APP_USER: ${ORACLE_APP_USER:-tinitiate}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-Tinitiate!23456}
    ports:
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  dynamodb:
    profiles: [dynamodb]
    image: amazon/dynamodb-local:latest
    # Initialize permissions on the named volume before starting as the image's user.
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:${DYNAMODB_PORT:-8500}:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    restart: unless-stopped

  dynamodb-init:
    profiles: [dynamodb]
    image: amazon/dynamodb-local:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown dynamodblocal:dynamodblocal /home/dynamodblocal/data"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    restart: "no"

volumes:
  mssql_data:
  mssql_backup:
  postgres_data:
  mysql_data:
  oracle_data:
  dynamodb_data:

configs:
  postgres_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;
