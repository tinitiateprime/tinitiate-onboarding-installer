name: tinitiate-oracle-developer

services:
  dev:
    build:
      context: ../..
      dockerfile: docker/oracle/Dockerfile
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-Tinitiate!23456}
      ORACLE_DSN: oracle:1521/FREEPDB1
      ORACLE_USER: ${ORACLE_APP_USER:-tinitiate}
      ORACLE_PASSWORD: ${ORACLE_APP_PASSWORD:-Tinitiate!23456}
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../../:/home/coder/project
      - oracle_code_server_data:/home/coder/.local/share/code-server
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-Tinitiate!23456}
      APP_USER: ${ORACLE_APP_USER:-tinitiate}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-Tinitiate!23456}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  oracle_code_server_data:
  oracle_data:

