name: tinitiate-dbt

services:
  dev:
    build:
      context: ../..
      dockerfile: docker/dbt/Dockerfile
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-Tinitiate!23456}
      DBT_PROFILES_DIR: /home/coder/.dbt
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://floci-aws:4566
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=${FLOCI_AZURE_ACCOUNT_KEY:-bG9jYWwtZmxvY2ktc3R1ZGVudC1rZXk=};BlobEndpoint=http://floci-azure:4577/devstoreaccount1;
      DBT_POSTGRES_HOST: postgres
      DBT_POSTGRES_USER: ${DBT_POSTGRES_USER:-tinitiate}
      DBT_POSTGRES_PASSWORD: ${DBT_POSTGRES_PASSWORD:-Tinitiate!23456}
      DBT_POSTGRES_DB: ${DBT_POSTGRES_DB:-analytics}
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../../:/home/coder/project
      - dbt_code_server_data:/home/coder/.local/share/code-server
      - dbt_profiles:/home/coder/.dbt
    depends_on:
      postgres:
        condition: service_healthy
      floci-aws:
        condition: service_started
      floci-azure:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DBT_POSTGRES_USER:-tinitiate}
      POSTGRES_PASSWORD: ${DBT_POSTGRES_PASSWORD:-Tinitiate!23456}
      POSTGRES_DB: ${DBT_POSTGRES_DB:-analytics}
    ports:
      - "${DBT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  floci-aws:
    image: floci/floci:latest
    environment:
      FLOCI_HOSTNAME: floci-aws
      FLOCI_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "${FLOCI_AWS_PORT:-4566}:4566"
    volumes:
      - dbt_aws_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  floci-azure:
    image: floci/floci-az:latest
    environment:
      FLOCI_AZ_BASE_URL: http://floci-azure:4577
      FLOCI_AZ_STORAGE_MODE: hybrid
      FLOCI_AZ_STORAGE_PATH: /app/data
    ports:
      - "${FLOCI_AZURE_PORT:-4577}:4577"
    volumes:
      - dbt_azure_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  dbt_code_server_data:
  dbt_profiles:
  dbt_postgres_data:
  dbt_aws_data:
  dbt_azure_data:

