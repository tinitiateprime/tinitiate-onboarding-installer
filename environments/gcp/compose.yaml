name: tinitiate-gcp

services:
  dev:
    build:
      context: ../..
      dockerfile: docker/gcp/Dockerfile
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-Tinitiate!23456}
      CLOUDSDK_CONFIG: /home/coder/.config/gcloud
      CLOUDSDK_CORE_PROJECT: ${GCP_PROJECT_ID:-floci-local}
      CLOUDSDK_API_ENDPOINT_OVERRIDES_STORAGE: http://floci-gcp:4588/
      PUBSUB_EMULATOR_HOST: floci-gcp:4588
      FIRESTORE_EMULATOR_HOST: floci-gcp:4588
      DATASTORE_EMULATOR_HOST: floci-gcp:4588
      STORAGE_EMULATOR_HOST: http://floci-gcp:4588
      SECRET_MANAGER_EMULATOR_HOST: floci-gcp:4588
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../../:/home/coder/project
      - gcp_code_server_data:/home/coder/.local/share/code-server
      - gcp_config:/home/coder/.config/gcloud
    depends_on:
      - floci-gcp
    restart: unless-stopped

  floci-gcp:
    image: floci/floci-gcp:latest
    environment:
      FLOCI_GCP_HOSTNAME: floci-gcp
      FLOCI_GCP_BASE_URL: http://floci-gcp:4588
      FLOCI_GCP_DEFAULT_PROJECT_ID: ${GCP_PROJECT_ID:-floci-local}
      FLOCI_GCP_STORAGE_MODE: hybrid
      FLOCI_GCP_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "${FLOCI_GCP_PORT:-4588}:4588"
    volumes:
      - gcp_floci_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  floci-ui:
    image: floci/floci-ui:latest
    ports:
      - "${FLOCI_UI_PORT:-4500}:4500"
    depends_on:
      - floci-gcp
    restart: unless-stopped

volumes:
  gcp_code_server_data:
  gcp_config:
  gcp_floci_data:
