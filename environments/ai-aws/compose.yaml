name: tinitiate-ai-aws

services:
  dev:
    build:
      context: ../..
      dockerfile: docker/ai/Dockerfile
      args:
        AI_PROVIDER: aws
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-Tinitiate!23456}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DATABASE_URL: postgresql+psycopg://${AI_POSTGRES_USER:-tinitiate}:${AI_POSTGRES_PASSWORD:-Tinitiate!23456}@postgres:5432/${AI_POSTGRES_DB:-ai_lab}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-tinitiate}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-Tinitiate!23456}
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../../:/home/coder/project
      - ai_aws_code_server_data:/home/coder/.local/share/code-server
      - ai_aws_config:/home/coder/.aws
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${AI_POSTGRES_USER:-tinitiate}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:-Tinitiate!23456}
      POSTGRES_DB: ${AI_POSTGRES_DB:-ai_lab}
    ports:
      - "${AI_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ai_aws_postgres_data:/var/lib/postgresql/data
    configs:
      - source: vector_init
        target: /docker-entrypoint-initdb.d/001-enable-vector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tinitiate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Tinitiate!23456}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ai_aws_minio_data:/data
    restart: unless-stopped

volumes:
  ai_aws_code_server_data:
  ai_aws_config:
  ai_aws_postgres_data:
  ai_aws_minio_data:

configs:
  vector_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;

