name: tinitiate-azure

services:
  dev:
    build:
      context: ../..
      dockerfile: docker/azure/Dockerfile
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:?Set CODE_SERVER_PASSWORD in .env}
      AZURE_CONFIG_DIR: /home/coder/.azure
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=${FLOCI_AZURE_ACCOUNT_KEY:-bG9jYWwtZmxvY2ktc3R1ZGVudC1rZXk=};BlobEndpoint=http://floci-azure:4577/devstoreaccount1;QueueEndpoint=http://floci-azure:4577/devstoreaccount1-queue;TableEndpoint=http://floci-azure:4577/devstoreaccount1-table;
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../../:/home/coder/project
      - azure_code_server_data:/home/coder/.local/share/code-server
      - azure_config:/home/coder/.azure
    depends_on:
      - floci-azure
    restart: unless-stopped

  floci-azure:
    image: floci/floci-az:latest
    environment:
      FLOCI_AZ_BASE_URL: http://floci-azure:4577
      FLOCI_AZ_STORAGE_MODE: hybrid
      FLOCI_AZ_STORAGE_PATH: /app/data
    ports:
      - "${FLOCI_AZURE_PORT:-4577}:4577"
    volumes:
      - azure_floci_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  floci-ui:
    image: floci/floci-ui:latest
    ports:
      - "${FLOCI_UI_PORT:-4500}:4500"
    depends_on:
      - floci-azure
    restart: unless-stopped

volumes:
  azure_code_server_data:
  azure_config:
  azure_floci_data:
