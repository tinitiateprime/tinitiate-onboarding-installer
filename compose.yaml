name: tinitiate-student-dev

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:?Set CODE_SERVER_PASSWORD in .env}
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ./:/home/coder/project
      - code_server_data:/home/coder/.local/share/code-server
    restart: unless-stopped

volumes:
  code_server_data:
